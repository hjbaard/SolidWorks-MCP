[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solidworks-mcp"
version = "0.2.0"
description = "MCP server that drives a local SolidWorks instance over COM for parametric part modelling."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Henk Jan Baard" }]
keywords = ["solidworks", "mcp", "cad", "com", "parametric", "3d-printing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pywin32>=306",
    "mcp>=1.0",
]

[project.urls]
Homepage = "https://github.com/hjbaard/SolidWorks-MCP"
Repository = "https://github.com/hjbaard/SolidWorks-MCP"
Changelog = "https://github.com/hjbaard/SolidWorks-MCP/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
solidworks-mcp = "solidworks_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "solidworks: integration test that needs a running SolidWorks instance",
]
