[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solidworks-mcp"
version = "0.1.0"
description = "MCP server that drives a local SolidWorks instance over COM for parametric part modelling."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pywin32>=306",
    "mcp>=1.0",
]

[project.scripts]
solidworks-mcp = "solidworks_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
